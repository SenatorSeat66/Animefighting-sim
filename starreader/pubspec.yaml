name: starreader
description: "An independent, thoughtfully designed manga reading space."
publish_to: 'none'
version: 0.2.0+2
environment:
  sdk: ^3.13.7
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  provider: ^6.1.5+1
  sqflite: ^2.4.6
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  file_picker: ^10.3.10
  archive: ^4.6.0
  scrollable_positioned_list: ^0.3.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.6

flutter:
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader.ttf
  assets:
    - assets/fonts/OFL.txt
    - assets/fonts/Newsreader-OFL.txt
    - assets/provenance.json
    - assets/licenses/
